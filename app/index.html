<style>
/* TRADAL Lighthouse launcher · Ocean + yolk, light (Helm 22 Nov: light is standard; same look as the Lighthouse) */
:root{--bg:#f6f9fc;--ink:#101b28;--muted:#4a6178;--ocean:#0d4a85;--deep:#072a4d;--frost:#bfe4f8;--yolk:#f0c445}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
  background:radial-gradient(70% 45% at 60% 0%,rgba(191,228,248,.75),rgba(191,228,248,0) 70%),var(--bg);color:var(--ink);font:16px/1.45 "Inter Tight",-apple-system,Segoe UI,Helvetica,Arial,sans-serif;text-align:center}
img{width:120px;height:120px;border-radius:27px;box-shadow:0 14px 34px rgba(13,74,133,.28)}
h1{margin:.2rem 0 0;font-weight:300;font-size:clamp(28px,8vw,40px);line-height:1.1;letter-spacing:-.01em}
h1 em{font:400 italic 1.08em "Instrument Serif",Georgia,serif;color:var(--ocean)}
a.go{display:inline-flex;align-items:center;gap:.55rem;background:var(--ocean);color:#fff;font-weight:600;font-size:1.05rem;padding:.95rem 1.9rem;border-radius:99px;text-decoration:none;box-shadow:0 8px 22px rgba(13,74,133,.3)}
a.go::after{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--yolk)}
a.go:active{background:var(--deep)}
small{color:var(--muted);max-width:22rem;font-size:.95rem}
small b{color:var(--ink)}
</style></head><body>
<img src="icon-512.png" alt="TRADAL">
<h1>Lighthouse, <em>the one place to look.</em></h1>
<a class="go" id="go" href="https://claude.ai/artifact/E5gN1NCQt1am74VzPTuhg7">Open Lighthouse</a>
<small id="tip">To keep it on your phone: tap Share, then <b>Add to Home Screen</b>. The TRADAL icon opens Lighthouse straight away.</small>
<script>
var L='https://claude.ai/artifact/E5gN1NCQt1am74VzPTuhg7';
var home=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||/[?&]launch=1/.test(location.search);
if(home){document.getElementById('tip').textContent='Opening Lighthouse…';location.replace(L);}
</script>
</body></html>
